<!DOCTYPE html>
<html>
<head>
    <title>MC Chat Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a2e; color: white; }
        input { padding: 10px; width: 300px; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; background: #333; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Mission Control Chat Test</h1>
    <input type="text" id="msg" placeholder="Type a message..." value="Hello from test page">
    <button onclick="sendMsg()">Send</button>
    <div id="result">Click send to test...</div>

    <script>
        async function sendMsg() {
            const msg = document.getElementById('msg').value;
            const result = document.getElementById('result');
            result.textContent = 'Sending...';
            
            try {
                const res = await fetch('https://mission-control-api.georgebot253.workers.dev/api/messages', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer mc-sync-2026'
                    },
                    body: JSON.stringify({ 
                        from: 'Anthony',
                        text: msg,
                        agent: 'george'
                    })
                });
                
                const data = await res.json();
                result.textContent = 'SUCCESS!\n\n' + JSON.stringify(data, null, 2);
            } catch (err) {
                result.textContent = 'ERROR!\n\n' + err.message;
            }
        }
    </script>
</body>
</html>
